<!-- 🔐 Premium Semantic OTP (Clean Code Edition) -->
<main class="otp-viewport">
  <div class="otp-card fade-up">
    
    <!-- Branding Header -->
    <header class="card-header">
      <div class="status-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
        </svg>
      </div>
      <h2 class="card-title">Verify Identity</h2>
      <p class="card-subtitle">Please enter the 6-digit code sent to your email.</p>
    </header>

    <!-- Error Toast -->
    <div *ngIf="error" class="error-toast">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
      </svg>
      <span>{{ error }}</span>
    </div>

    <!-- OTP Form -->
    <form (ngSubmit)="onSubmit()" #otpForm="ngForm" class="otp-form">
      <div class="field-item">
        <label for="otp">Verification Code</label>
        <input 
          type="text" 
          id="otp" 
          name="otp" 
          [(ngModel)]="otp" 
          required 
          maxlength="6"
          placeholder="000000"
          autocomplete="one-time-code"
          class="code-input"
        >
        <p class="field-hint italic">Check your terminal if email delivery is delayed</p>
      </div>

      <!-- Action -->
      <button type="submit" class="submit-action" [disabled]="otpForm.invalid || loading">
        <span *ngIf="!loading">Unlock My Account</span>
        <span *ngIf="loading" class="processing">
            <svg class="spinner" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            </svg>
            Verifying...
        </span>
      </button>

      <!-- Resend Section -->
      <footer class="resend-footer">
        <p>Didn't receive a code? <button type="button" (click)="resendOtp()" class="resend-btn">Request a New Code</button></p>
      </footer>
    </form>

  </div>
</main>
